[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "batterywise"
version = "0.3.0"
description = "An open solar-plus-storage dispatch simulator with validated grid data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]
[project.optional-dependencies]
test = ["pytest>=8"]
data = ["openpyxl>=3.1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
